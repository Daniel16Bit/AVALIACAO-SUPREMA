name: Validar projeto
on:
  push:
  pull_request:
# As acoes sao fixadas pelo hash do commit; a versao correspondente esta no comentario.
permissions:
  contents: read
jobs:
  validacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Bloqueia somente em gravidade alta ou critica. Avisos moderados aparecem
      # no passo seguinte, sem bloquear: muitos nao tem correcao disponivel.
      - name: Auditoria de dependencias (bloqueia em high e critical)
        run: npm audit --audit-level=high
      - name: Auditoria de dependencias (relatorio completo, nao bloqueia)
        if: always()
        continue-on-error: true
        run: npm audit
      - name: Sintaxe, lint e testes
        run: npm test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: relatorios-api
          path: tests/reports/*.json
  navegador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: pip install -r tests/browser/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Teste de navegador
        run: python tests/browser/smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: relatorios-navegador
          path: |
            tests/reports/browser-*.png
            tests/reports/browser-smoke.json
